<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Universal Game-Hub</title>

<link rel="icon" type="image/png" href="Favicon.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Relief&display=swap');

:root {
    --purple-main: #b06bff;
    --purple-soft: rgba(176, 107, 255, 0.15);
}

body {
    background: #000;
    color: #e6e6e6;
    font-family: 'Comic Relief', Arial, sans-serif;
    margin: 0;
}

header {
    padding: 25px;
    text-align: center;
    background: #0a0013;
    font-size: 36px;
    font-weight: bold;
    color: var(--purple-main);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

#settingsBtn {
    background:#b06bff;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

#games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 25px;
    padding: 25px;
}

.game {
    background: var(--purple-soft);
    padding: 15px;
    border-radius: 14px;
    text-align: center;
    cursor: pointer;
    transition: 0.25s;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
    opacity: 0;
    animation: fadeIn 0.4s forwards;
}

.game:hover {
    background: rgba(176, 107, 255, 0.25);
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

.game img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
}

.game-title {
    margin-top: 12px;
    font-size: 20px;
    font-weight: bold;
    color: var(--purple-main);
}

#viewer {
    display: none;
    width: 100%;
    height: 100vh;
    flex-direction: column;
}

#viewer iframe {
    width: 100%;
    height: calc(100vh - 60px);
    border: none;
}

#viewerBar {
    background: #4a007d;
    color: white;
    padding: 12px 20px;
    font-size: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#viewerBar button {
    background: #b06bff;
    color: white;
    border: none;
    padding: 8px 14px;
    margin-left: 10px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
}

#viewerBar button:hover {
    background: #d9b3ff;
    color: #4a007d;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* SETTINGS PANEL */
#settingsPanel {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:#0a0013;
    padding:25px;
    border-radius:14px;
    box-shadow:0 0 25px rgba(0,0,0,0.6);
    width:350px;
    color:white;
    font-family:'Comic Relief';
    z-index:9999;
}

/* LIVE USER COUNTER */
#onlineCount {
    position: fixed;
    bottom: 12px;
    right: 12px;
    background: #0a0013;
    color: white;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 15px;
    font-family: 'Comic Relief';
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<header>
    Universal EDU
    <button id="settingsBtn">Settings</button>
</header>

<div id="games"></div>

<div id="viewer">
    <div id="viewerBar">
        <div id="viewerTitle"></div>
        <div>
            <button onclick="document.getElementById('viewerFrame').requestFullscreen()">Fullscreen</button>
            <button id="openNewTabBtn">Open in New Tab</button>
            <button onclick="closeViewer()">Close</button>
        </div>
    </div>
    <iframe id="viewerFrame"></iframe>
</div>

<!-- LIVE USER COUNTER -->
<div id="onlineCount">Online: ...</div>

<!-- SETTINGS PANEL -->
<div id="settingsPanel">
    <h2 style="color:#b06bff; margin-top:0;">Settings</h2>

    <label>Text Color:</label>
    <input type="color" id="textColorPicker" value="#b06bff" style="width:100%; margin-top:8px;">

    <label style="margin-top:20px;">Background Color:</label>
    <input type="color" id="bgColorPicker" value="#000000" style="width:100%; margin-top:8px;">

    <label style="margin-top:20px;">Header Color:</label>
    <input type="color" id="headerColorPicker" value="#0a0013" style="width:100%; margin-top:8px;">

    <hr style="margin:20px 0; border-color:#333;">

    <label>Tab Title:</label>
    <input type="text" id="tabTitleInput" placeholder="Enter new tab name" style="
        width:100%; padding:8px; margin-top:8px; border-radius:8px; border:none;
    ">

    <label style="margin-top:15px; display:block;">Tab Favicon URL:</label>
    <input type="text" id="faviconInput" placeholder="Image URL" style="
        width:100%; padding:8px; margin-top:8px; border-radius:8px; border:none;
    ">

    <button id="applySettingsBtn" style="
        margin-top:20px;
        width:100%;
        background:#b06bff;
        color:white;
        border:none;
        padding:10px;
        border-radius:8px;
        font-size:16px;
        cursor:pointer;
        font-weight:bold;
    ">Apply</button>

    <button id="closeSettingsBtn" style="
        margin-top:10px;
        width:100%;
        background:#333;
        color:white;
        border:none;
        padding:10px;
        border-radius:8px;
        font-size:16px;
        cursor:pointer;
        font-weight:bold;
    ">Close</button>
</div>

<script>
/* GITLAB ONLY — NO LOCAL GAMES */
const projectId = 86390728;
const ref = "main";

async function fetchGames() {
    const apiURL =
        `https://gitlab.com/api/v4/projects/${projectId}/repository/tree?path=Games&ref=${ref}`;

    const response = await fetch(apiURL);
    const items = await response.json();

    const container = document.getElementById("games");
    container.innerHTML = "";

    for (const item of items) {
        if (item.type === "tree") {
            const gameName = item.name;

            const folderURL =
                `https://gitlab.com/api/v4/projects/${projectId}/repository/tree?path=Games/${encodeURIComponent(gameName)}&ref=${ref}`;

            const folderRes = await fetch(folderURL);
            const folderFiles = await folderRes.json();

            const htmlFile = folderFiles.find(f => f.name.toLowerCase().endsWith(".html"));
            if (!htmlFile) continue;

            const coverFile = folderFiles.find(f => f.name.toLowerCase().includes("cover"));
            const coverURL = coverFile
                ? fileRawURL(`Games/${gameName}/${coverFile.name}`)
                : "https://via.placeholder.com/300x200?text=No+Cover";

            const div = document.createElement("div");
            div.className = "game";

            div.innerHTML = `
                <img src="${coverURL}">
                <div class="game-title">${gameName}</div>
            `;

            div.onclick = () => openSameTab(gameName, htmlFile);

            container.appendChild(div);
        }
    }
}

function fileRawURL(path) {
    const encoded = encodeURIComponent(path).replace(/%2F/g, "%2F");
    return `https://gitlab.com/api/v4/projects/${projectId}/repository/files/${encoded}/raw?ref=${ref}`;
}

async function openSameTab(gameName, htmlFile) {
    const rawURL = fileRawURL(`Games/${gameName}/${htmlFile.name}`);

    const htmlText = await fetch(rawURL).then(r => r.text());
    const blob = new Blob([htmlText], { type: "text/html" });
    const blobURL = URL.createObjectURL(blob);

    document.getElementById("viewerTitle").innerText = gameName;
    document.getElementById("viewerFrame").src = blobURL;

    const openNewTabBtn = document.getElementById("openNewTabBtn");
    openNewTabBtn.onclick = () => openNewTab(gameName, blobURL);

    document.querySelector("header").style.display = "none";

    document.getElementById("viewer").style.display = "flex";
    document.getElementById("games").style.display = "none";
}

function closeViewer() {
    document.getElementById("viewerFrame").src = "about:blank";

    document.getElementById("viewer").style.display = "none";
    document.getElementById("games").style.display = "grid";

    document.querySelector("header").style.display = "block";
}

function openNewTab(gameName, blobURL) {
    const newTab = window.open("", "_blank");

    newTab.document.write(`
        <html>
        <head>
            <title>${gameName}</title>
            <style>
                body {
                    margin: 0;
                    background: #000;
                    color: white;
                    font-family: 'Comic Relief', Arial, sans-serif;
                }
                #topBar {
                    background: #4a007d;
                    color: white;
                    padding: 12px 20px;
                    font-size: 22px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                }
                #topBar button {
                    background: #b06bff;
                    color: white;
                    border: none;
                    padding: 8px 14px;
                    margin-left: 10px;
                    border-radius: 8px;
                    font-size: 16px;
                    cursor: pointer;
                    font-weight: bold;
                }
                #topBar button:hover {
                    background: #d9b3ff;
                    color: #4a007d;
                }
                iframe {
                    width: 100%;
                    height: calc(100vh - 60px);
                    border: none;
                }
            </style>
        </head>
        <body>

            <div id="topBar">
                <div>${gameName}</div>
                <div>
                    <button onclick="document.getElementById('gameFrame').requestFullscreen()">Fullscreen</button>
                    <button onclick="window.close()">Close</button>
                </div>
            </div>

            <iframe id="gameFrame" src="${blobURL}"></iframe>

        </body>
        </html>
    `);

    newTab.document.close();
}

/* SETTINGS PANEL */
document.getElementById("settingsBtn").onclick = () => {
    document.getElementById("settingsPanel").style.display = "block";
};

document.getElementById("closeSettingsBtn").onclick = () => {
    document.getElementById("settingsPanel").style.display = "none";
};

document.getElementById("applySettingsBtn").onclick = () => {
    const newColor = document.getElementById("textColorPicker").value;
    const newBG = document.getElementById("bgColorPicker").value;
    const newHeaderColor = document.getElementById("headerColorPicker").value;
    const newTitle = document.getElementById("tabTitleInput").value.trim();
    const newFavicon = document.getElementById("faviconInput").value.trim();

    document.documentElement.style.setProperty("--purple-main", newColor);
    document.body.style.background = newBG;
    document.querySelector("header").style.background = newHeaderColor;

    if (newTitle.length > 0) {
        document.title = newTitle;
    }

    if (newFavicon.length > 0) {
        let link = document.querySelector("link[rel='icon']");
        if (!link) {
            link = document.createElement("link");
            link.rel = "icon";
            document.head.appendChild(link);
        }
        link.href = newFavicon;
    }

    document.getElementById("settingsPanel").style.display = "none";
};

/* SINGLE-TAB ONLINE COUNTER */
if (!localStorage.userID) {
    localStorage.userID = crypto.randomUUID();
}

const userID = localStorage.userID;
const channel = new BroadcastChannel("gamehub_presence");
let isLeader = false;

channel.onmessage = (msg) => {
    if (msg.data === "leader") {
        isLeader = false;
    }
};

channel.postMessage("leader");

setTimeout(() => {
    if (!isLeader) {
        isLeader = true;
    }
}, 200);

async function updateOnlineCount() {
    if (!isLeader) return;

    try {
        const res = await fetch(`/api/online?id=${userID}`);
        const data = await res.json();
        document.getElementById("onlineCount").textContent = `Online: ${data.count}`;
    } catch {
        document.getElementById("onlineCount").textContent = "Online: N/A";
    }
}

setInterval(updateOnlineCount, 5000);
updateOnlineCount();

/* LOAD GAMES */
fetchGames();
</script>

</body>
</html>
